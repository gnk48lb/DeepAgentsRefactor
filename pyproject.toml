[project]
name = "qqbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bilibili-api-python>=17.4.1",
    "browser-use>=0.12.6",
    "docker>=7.0.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.20.0",
    "jieba>=0.42.1",
    "langchain>=0.3.0",
    "langchain-community>=0.3.10",
    "langchain-core>=0.3.15",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.35",
    "langgraph-prebuilt>=0.1.0",
    "neo4j>=6.0.0",
    "nltk>=3.9.0",
    "nonebot-adapter-qq>=1.6.7",
    "nonebot2[fastapi]>=2.5.0",
    "pillow>=10.0.0",
    "playwright>=1.59.0",
    "pymilvus[milvus_lite,model]>=2.4.0",
    "milvus-lite>=2.4.0",
    "pymilvus-model>=0.3.0",
    "pymupdf>=1.23.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.10.0",
    "sentence-transformers>=3.0.0",
    "tavily-python>=0.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "mcp>=1.26.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
